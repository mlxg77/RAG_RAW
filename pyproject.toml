[project]
name = "rag-law"
version = "0.1.0"
description = "面向给定法律文本的法条问答系统（法律 RAG，V1）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_law"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
