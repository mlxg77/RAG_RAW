# V1 评测集（30 题）：用于检索召回与回答质量的基线评测
# 字段说明：
#   id            —— 唯一编号
#   type          —— 题型（直接查询/口语场景/跨条文/跨法律/指定条号/事实不足/超范围拒答）
#   question      —— 测试问题原文
#   should_answer —— 是否应给出确定回答（false = 应拒答或先追问）
#   expected      —— 预期命中的法条（law 用 manifest 中的正式名称，article 为条号）
#   note          —— 备注（评测时的行为预期）

