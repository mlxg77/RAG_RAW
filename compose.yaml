services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: "${RAG_LAW_PYTHON_IMAGE:-python:3.13-slim}"
        NODE_IMAGE: "${RAG_LAW_NODE_IMAGE:-node:22-alpine}"
    image: rag-law:v1.0
    command:
      - uvicorn
      - rag_law.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    env_file:
      - .env
    user: "${RAG_LAW_UID:-1000}:${RAG_LAW_GID:-1000}"
    environment:
      HOME: /tmp/raglaw
    ports:
      - "${RAG_LAW_API_PORT:-8000}:8000"
    volumes:
      # 页面上的「添加法律」「重新构建知识库」需要写权限。
      - ./data:/app/data
      - ./indexes:/app/indexes
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          result=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5));
          raise SystemExit(0 if result.get('status') == 'ok' else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
